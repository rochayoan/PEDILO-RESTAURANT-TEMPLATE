name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static audit
        run: npm run audit
      - name: Unit tests
        run: npm test
      - name: Agent typecheck
        run: npm run build --workspace=@pedilo/agent
      - name: Menu build
        run: npm run build --workspace=@pedilo/menu
